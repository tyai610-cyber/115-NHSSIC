 <path d="M0 700L380 320M0 745L425 320"/><path d="M1470 0L1600 125M1510 0L1600 88"/>
</g>
<path d="M0 740H1600" stroke="#e4bd74" stroke-opacity=".55" stroke-width="2"/>
</svg>