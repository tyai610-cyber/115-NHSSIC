<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">工業技術加工意象</title><desc id="desc">以深藍色工業背景、精密網格、CNC加工主軸、金屬工件與金色火花構成的抽象工業技術插畫。</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061b2d"/><stop offset=".55" stop-color="#123e56"/><stop offset="1" stop-color="#0b283e"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#4bb5bd" stop-opacity=".38"/><stop offset="1" stop-color="#4bb5bd" stop-opacity="0"/></radialGradient>
 <linearGradient id="steel" x2="1" y2="1"><stop stop-color="#e8f0f3"/><stop offset=".28" stop-color="#8da7b2"/><stop offset=".55" stop-color="#d9e4e8"/><stop offset="1" stop-color="#4c6979"/></linearGradient>
 <linearGradient id="darksteel" x2="0" y2="1"><stop stop-color="#9fb8c1"/><stop offset=".3" stop-color="#476577"/><stop offset="1" stop-color="#18364b"/></linearGradient>
 <linearGradient id="gold" x2="1"><stop stop-color="#f8d88d"/><stop offset="1" stop-color="#bd8740"/></linearGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b4d2d9" stroke-opacity=".10" stroke-width="1"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1600" height="760" fill="url(#bg)"/><rect width="1600" height="760" fill="url(#grid)"/>
<ellipse cx="1200" cy="370" rx="480" ry="380" fill="url(#glow)"/>
<path d="M0 650H1600M0 676H1600" stroke="#8db9c3" stroke-opacity=".16"/>
<path d="M0 0H520L0 520Z" fill="#0a3048" opacity=".45"/>
<path d="M1200 0L1600 0V760H1450L1170 480Z" fill="#1a5266" opacity=".24"/>
