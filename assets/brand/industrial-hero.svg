 <circle cx="1300" cy="370" r="300" stroke-width="2"/><circle cx="1300" cy="370" r="250" stroke-width="1" stroke-dasharray="6 13"/><circle cx="1300" cy="370" r="205" stroke-width="1"/>
 <path d="M1300 40V700M970 370H1580" stroke-dasharray="4 12"/>
</g>
<!-- CNC machine head -->
<g transform="translate(1040 32)">
